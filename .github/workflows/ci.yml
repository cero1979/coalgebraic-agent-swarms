name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned Python environment
        run: python -m pip install --requirement requirements.txt

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            texlive-fonts-extra \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science

      - name: Run unit and integration tests
        run: make test

      - name: Regenerate deterministic evidence
        run: |
          make prototype-results
          make experiments

      - name: Verify generated manifests
        run: make verify

      - name: Compile manuscript
        run: make paper

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: array-reproducibility-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            main.pdf
            main.log
            experiments/results/
            submission/array/
