name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned Python environment
        run: python -m pip install --requirement requirements.txt

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            latexmk \
            texlive-fonts-extra \
            texlive-latex-extra \
            texlive-pictures \
            texlive-science

      - name: Verify committed evidence snapshot
        run: make verify

      - name: Run complete reproducibility and submission pipeline
        run: make all

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: array-reproducibility-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            main.pdf
            main.log
            prototype/results/
            experiments/results/
            submission/array/
